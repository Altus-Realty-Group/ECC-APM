name: Legacy owners sync quarantined

# Retirement only. No automatic trigger or credentialed operation may be restored here.
"on":
  workflow_dispatch:

permissions: {}

jobs:
  quarantine-refusal:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse retired operation
        shell: bash
        run: |
          printf '%s\n' 'Owners sync is quarantined. No operation was attempted. See docs/recovery/LEGACY_AUTOMATION_QUARANTINE_20261017.md.' >&2
          exit 1
