name: Verify

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Determine dashboard browser proof scope
        id: dashboard-scope
        shell: bash
        env:
          DASHBOARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'legal=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$DASHBOARD_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${DASHBOARD_BASE_SHA}^{commit}"
          git diff --name-only "$DASHBOARD_BASE_SHA...HEAD" -- src/features/dashboard src/components/recovery src/styles src/lib/format.ts src/lib/dataState.ts src/components/ui/StateNotice.tsx package.json package-lock.json tests/browser/dashboard-proof scripts/dashboard-browser-proof.mjs scripts/dashboard-proof-vite.config.mjs .github/workflows/verify.yml > "$RUNNER_TEMP/dashboard-proof-changes.txt"
          if [ -s "$RUNNER_TEMP/dashboard-proof-changes.txt" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
          git diff --name-only "$DASHBOARD_BASE_SHA...HEAD" -- src/features/legal src/App.tsx src/styles src/components/ui/StateNotice.tsx src/lib/dataState.ts src/lib/http.ts src/lib/queryClient.ts src/lib/sessionScope.ts tests/browser/legal-proof scripts/legal-browser-proof.mjs scripts/legal-proof-vite.config.mjs package.json package-lock.json .github/workflows/verify.yml > "$RUNNER_TEMP/legal-proof-changes.txt"
          if [ -s "$RUNNER_TEMP/legal-proof-changes.txt" ]; then
            echo 'legal=true' >> "$GITHUB_OUTPUT"
          else
            echo 'legal=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20, package-manager-cache: false }
      - run: npm ci
      - name: Guardrail
        run: npm run guardrail
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build --if-present
      - name: Unit tests (if present)
        run: npm test --if-present
      - name: Dependency compatibility
        run: npm run test:dependencies
      - name: Install scoped browser
        if: steps.dashboard-scope.outputs.run == 'true' || steps.dashboard-scope.outputs.legal == 'true'
        run: npx playwright install --with-deps chromium --only-shell
      - name: Dashboard exact-source browser proof
        if: steps.dashboard-scope.outputs.run == 'true'
        timeout-minutes: 3
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROOF_ARTIFACT_DIR: ${{ runner.temp }}/ecc-dashboard-proof-artifacts
        run: node scripts/dashboard-browser-proof.mjs
      - name: Upload dashboard browser receipt and images
        if: always() && steps.dashboard-scope.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-browser-proof
          path: ${{ runner.temp }}/ecc-dashboard-proof-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Legal exact-source browser proof
        if: steps.dashboard-scope.outputs.legal == 'true'
        timeout-minutes: 3
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROOF_ARTIFACT_DIR: ${{ runner.temp }}/ecc-legal-proof-artifacts
        run: node scripts/legal-browser-proof.mjs
      - name: Upload legal browser receipt and images
        if: always() && steps.dashboard-scope.outputs.legal == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-browser-proof
          path: ${{ runner.temp }}/ecc-legal-proof-artifacts
          if-no-files-found: warn
          retention-days: 7
